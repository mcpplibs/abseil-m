name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcpp:
    name: mcpp (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     toolchain: 'gcc@16.1.0' }
          - { os: ubuntu-24.04,     toolchain: 'llvm@23.1.3' }
          - { os: ubuntu-24.04-arm, toolchain: 'gcc@16.1.0' }
          - { os: ubuntu-24.04-arm, toolchain: 'llvm@23.1.3' }
          - { os: macos-15,         toolchain: 'llvm@23.1.3' }
          - { os: windows-2025,     toolchain: 'llvm@23.1.3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mwrap identity and bilingual README contract
        run: python3 tools/check_mwrap_release.py

      - name: Install Xlings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install Xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Select the toolchain
        run: |
          name="${{ matrix.toolchain }}"
          mcpp toolchain install "${name%@*}" "${name#*@}"
          mcpp toolchain default "$name"

      - name: Build the modules
        run: mcpp build

      - name: Tests (the API through the module; every mapped constant against its macro; flags, LOG and CHECK with the module; header mixing)
        run: mcpp test

      - name: Tests, release profile
        run: mcpp test --profile release

      - name: Export audit (the sources are the record; on the LLVM row the record is derived again by clang from the headers)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ] && [ "${{ matrix.toolchain }}" = "llvm@23.1.3" ]; then
            export MWRAP_REQUIRE_CLANG=1
            export MWRAP_CLANG="$(ls -d "$HOME"/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.3/bin/clang++ "$HOME"/.xlings/data/xpkgs/xim-x-llvm/23.1.3/bin/clang++ 2>/dev/null | head -1)"
          fi
          python3 tools/check_exports.py

  # The Web: wasm32-emscripten (emsdk from xlings, through mcpp), the tests under node, one thread.
  web:
    name: mcpp (web, wasm32-emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Tests under node
        run: mcpp test --target wasm32-emscripten

      - name: Tests under node, release profile
        run: mcpp test --target wasm32-emscripten --profile release
